name: directory_ipuc
description: "Directorio de hermanos - Iglesia Pentecostal Unida de Colombia"
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  animate_do: ^3.3.4
  url_launcher: ^6.3.1
  font_awesome_flutter: ^11.0.0
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.6
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  http: ^1.2.2
  lottie: ^3.1.0
  share_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/app_icon.png"
  windows:
    generate: false
  macos:
    generate: false

flutter_native_splash:
  color: "#F0F3FA"
  color_dark: "#091728"
  image: assets/app_icon.png
  image_dark: assets/app_icon.png
  branding: assets/splash_branding_light.png
  branding_dark: assets/splash_branding_dark.png
  branding_bottom_padding: 24
  android: true
  ios: true
  android_12:
    color: "#F0F3FA"
    color_dark: "#091728"
    image: assets/app_icon.png
    image_dark: assets/app_icon.png
    branding: assets/splash_branding_light.png
    branding_dark: assets/splash_branding_dark.png

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/
  fonts:
    - family: MyriadPro
      fonts:
        - asset: assets/fonts/MyriadPro-Light.otf
          weight: 300
        - asset: assets/fonts/MYRIADPRO-REGULAR.OTF
          weight: 400
        - asset: assets/fonts/MYRIADPRO-SEMIBOLD.OTF
          weight: 600
        - asset: assets/fonts/MYRIADPRO-SEMIBOLDIT.OTF
          weight: 600
          style: italic
        - asset: assets/fonts/MYRIADPRO-BOLD.OTF
          weight: 700
        - asset: assets/fonts/MYRIADPRO-BOLDIT.OTF
          weight: 700
          style: italic
